name: Treinar modelo

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Treinar preset tiny
        run: python train.py --preset tiny --steps 2000 --out artifacts
      - name: Enviar checkpoint como artefato
        uses: actions/upload-artifact@v4
        with:
          name: tomatinho-checkpoint
          path: artifacts/
