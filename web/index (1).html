<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tomatinho AI 0.1</title>
<style>
:root{font-family:system-ui,sans-serif;color:#202020;background:#f5f5f5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}
main{width:min(720px,100%);background:white;border:1px solid #ddd;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0000000d}
h1{margin:0;color:#c73535}.sub{color:#666;margin-top:5px}
textarea{width:100%;min-height:130px;padding:13px;border:1px solid #ccc;border-radius:12px;font:inherit;resize:vertical}
button{background:#c73535;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700;margin-top:12px}
button:disabled{opacity:.5}#result{white-space:pre-wrap;background:#fafafa;border:1px solid #eee;border-radius:12px;padding:14px;margin-top:16px;min-height:70px}
small{color:#777}
</style>
</head>
<body>
<main>
<h1>🍅 Tomatinho AI</h1>
<div class="sub">Protótipo 0.1 · modelo experimental treinado do zero</div>
<p><textarea id="prompt" placeholder="Escreva uma mensagem para o modelo..."></textarea></p>
<button id="send">Gerar resposta</button>
<div id="result">A resposta aparecerá aqui.</div>
<p><small>Este modelo inicial prevê caracteres e ainda não é um assistente confiável.</small></p>
</main>
<script>
const API_URL = "http://127.0.0.1:8000";
const button = document.querySelector("#send");
button.addEventListener("click", async () => {
  const prompt = document.querySelector("#prompt").value.trim();
  const result = document.querySelector("#result");
  if (!prompt) { result.textContent = "Digite uma mensagem."; return; }
  button.disabled = true; result.textContent = "Gerando...";
  try {
    const response = await fetch(API_URL + "/generate", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({prompt, max_new_tokens:120, temperature:0.8})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Falha na API");
    result.textContent = data.text;
  } catch (e) { result.textContent = "Erro: " + e.message + "\nVerifique se a API está rodando."; }
  finally { button.disabled = false; }
});
</script>
</body>
</html>
